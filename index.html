<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz</title>

    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <main class="quiz-container">

        <h1>Quiz</h1>

        <!-- Kategorie -->
        <label for="category">Kategorie:</label>

        <select id="category">
            <option value="">Alle Kategorien</option>
        </select>

        <!-- Frage -->
        <h2 id="question">
            Frage wird geladen...
        </h2>

        <!-- Antworten -->
        <div id="answers"></div>

        <!-- Ergebnis -->
        <p id="result"></p>

        <!-- Nächste Frage -->
        <button id="nextButton">
            Nächste Frage
        </button>

        <!-- Highscore -->
        <h2>Highscores</h2>
        <ol id="highscores"></ol>
        <button id="saveButton">Highscore speichern</button>

    </main>

    <script src="script.js"></script>

</body>
</html>
